services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sia-alghivari-app:local
    container_name: sia_app_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-8085}:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sia_alghivari}
      - DB_USERNAME=${DB_USERNAME:-sia_user}
      - DB_PASSWORD=${DB_PASSWORD:-sia_secret_password}
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - .:/app
      - dev_storage_data:/app/storage/app
    networks:
      - sia_dev_network
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: sia_mysql_dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sia_alghivari}
      MYSQL_USER: ${DB_USERNAME:-sia_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sia_secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3388}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    networks:
      - sia_dev_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  sia_dev_network:
    name: sia_dev_network
    driver: bridge

volumes:
  dev_mysql_data:
    driver: local
  dev_storage_data:
    driver: local

